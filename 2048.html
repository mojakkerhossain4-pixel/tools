<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Toolbox</title>
<style>
  :root{
    --page: #FBF9F4;
    --ink: #201A12;
    --ink-soft: #6B6153;
    --line: #E4DDCB;
    --rose-a: #7A2E3D;
    --rose-b: #A64B5C;
    --blush: #F7E9EB;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
  .wrap{ max-width: 540px; margin: 0 auto; padding: 0 24px 56px; }
  header{ padding: 30px 0 26px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .back{ font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); text-decoration: none; }
  .back:hover{ text-decoration: underline; }
  .badge{ font-size: 12.5px; color: var(--ink-soft); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
  h1{ font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1.1; margin: 4px 0 10px; }
  .lede{ color: var(--ink-soft); font-size: 15.5px; margin: 0 0 24px; }
  .game-card{ padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .score-row{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .score-label{ color: var(--ink-soft); font-size: 12px; letter-spacing: .04em; }
  .score{ display: block; color: var(--rose-a); font: 25px var(--font-display); line-height: 1.1; }
  .board{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; border-radius: 12px; background: #E4DDCB; touch-action: none; }
  .tile{ display: grid; place-items: center; aspect-ratio: 1; border-radius: 8px; background: #FBF9F4; color: #6B6153; font: 600 clamp(18px, 6vw, 30px) var(--font-body); }
  .tile[data-value="2"]{ background: #F7E9EB; color: #7A2E3D; }
  .tile[data-value="4"]{ background: #F3DADD; color: #7A2E3D; }
  .tile[data-value="8"]{ background: #E7A93C; color: #fff; }
  .tile[data-value="16"]{ background: #D88A55; color: #fff; }
  .tile[data-value="32"]{ background: #A64B5C; color: #fff; }
  .tile[data-value="64"]{ background: #7A2E3D; color: #fff; }
  .tile[data-value="128"],.tile[data-value="256"],.tile[data-value="512"]{ background: #2E8577; color: #fff; font-size: clamp(16px, 5vw, 25px); }
  .tile[data-value="1024"],.tile[data-value="2048"]{ background: #433C74; color: #fff; font-size: clamp(14px, 4.5vw, 22px); }
  .status{ min-height: 24px; margin: 12px 0 0; color: var(--ink-soft); font-size: 13.5px; text-align: center; }
  .actions{ display: flex; justify-content: center; margin-top: 14px; }
  .primary{ min-height: 44px; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--rose-a); color: var(--blush); font: 600 14px var(--font-body); cursor: pointer; }
  .primary:hover{ background: var(--rose-b); }
  .help{ margin: 16px 0 0; color: var(--ink-soft); font-size: 13px; text-align: center; }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--rose-a); outline-offset: 3px; }
  @media (max-width: 480px){ .wrap{ padding: 0 18px 40px; } .game-card{ padding: 12px; } .board{ gap: 6px; padding: 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">Toolbox</a>
    <span class="badge">Solo puzzle</span>
  </header>

  <h1>2048</h1>
  <p class="lede">Combine matching tiles. Keep making space and see if you can reach 2048.</p>

  <main class="game-card" aria-label="2048 game">
    <div class="score-row">
      <div><span class="score-label">SCORE</span><strong class="score" id="score">0</strong></div>
      <div style="text-align:right"><span class="score-label">BEST</span><strong class="score" id="best">0</strong></div>
    </div>
    <div class="board" id="board" role="grid" aria-label="2048 game board"></div>
    <p class="status" id="status" aria-live="polite">Use arrow keys or swipe to move the tiles.</p>
    <div class="actions"><button class="primary" id="newGame" type="button">New game</button></div>
    <p class="help">Use arrow keys or WASD. On a phone, swipe in any direction.</p>
  </main>
</div>
<script>
  const boardElement = document.getElementById("board");
  const scoreElement = document.getElementById("score");
  const bestElement = document.getElementById("best");
  const statusElement = document.getElementById("status");
  let board = [];
  let score = 0;
  let best = 0;
  let finished = false;
  let touchStart = null;

  function render(){
    boardElement.replaceChildren();
    board.forEach((value, index) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.setAttribute("role", "gridcell");
      tile.setAttribute("aria-label", value ? String(value) : "Empty");
      tile.dataset.value = value || "";
      tile.textContent = value || "";
      boardElement.appendChild(tile);
    });
    scoreElement.textContent = score;
    bestElement.textContent = best;
  }

  function addTile(){
    const empty = board.map((value, index) => value === 0 ? index : -1).filter(index => index >= 0);
    if(!empty.length) return;
    const index = empty[Math.floor(Math.random() * empty.length)];
    board[index] = Math.random() < 0.9 ? 2 : 4;
  }

  function startGame(){
    board = Array(16).fill(0);
    score = 0;
    finished = false;
    statusElement.textContent = "Use arrow keys or swipe to move the tiles.";
    addTile();
    addTile();
    render();
  }

  function lineIndices(direction, line){
    const indexes = [];
    for(let offset = 0; offset < 4; offset++){
      if(direction === "left") indexes.push(line * 4 + offset);
      if(direction === "right") indexes.push(line * 4 + (3 - offset));
      if(direction === "up") indexes.push(offset * 4 + line);
      if(direction === "down") indexes.push((3 - offset) * 4 + line);
    }
    return indexes;
  }

  function canMove(){
    if(board.some(value => value === 0)) return true;
    for(let row = 0; row < 4; row++){
      for(let column = 0; column < 4; column++){
        const index = row * 4 + column;
        if(column < 3 && board[index] === board[index + 1]) return true;
        if(row < 3 && board[index] === board[index + 4]) return true;
      }
    }
    return false;
  }

  function move(direction){
    if(finished) return;
    const next = board.slice();
    let gained = 0;
    for(let line = 0; line < 4; line++){
      const indexes = lineIndices(direction, line);
      const values = indexes.map(index => board[index]).filter(Boolean);
      const merged = [];
      for(let index = 0; index < values.length; index++){
        if(values[index] === values[index + 1]){
          const value = values[index] * 2;
          merged.push(value);
          gained += value;
          index++;
        } else {
          merged.push(values[index]);
        }
      }
      indexes.forEach((boardIndex, index) => {
        next[boardIndex] = merged[index] || 0;
      });
    }
    if(next.every((value, index) => value === board[index])) return;
    board = next;
    score += gained;
    best = Math.max(best, score);
    addTile();
    render();
    if(board.includes(2048)){
      finished = true;
      statusElement.textContent = "You made 2048! Start a new game to play again.";
    } else if(!canMove()){
      finished = true;
      statusElement.textContent = `No moves left. Final score: ${score}.`;
    }
  }

  const keyDirections = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down"
  };
  document.addEventListener("keydown", event => {
    const direction = keyDirections[event.key];
    if(direction){
      event.preventDefault();
      move(direction);
    }
  });
  boardElement.addEventListener("touchstart", event => {
    const touch = event.changedTouches[0];
    touchStart = {x: touch.clientX, y: touch.clientY};
  }, {passive: true});
  boardElement.addEventListener("touchend", event => {
    if(!touchStart) return;
    const touch = event.changedTouches[0];
    const dx = touch.clientX - touchStart.x;
    const dy = touch.clientY - touchStart.y;
    touchStart = null;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, {passive: true});
  document.getElementById("newGame").addEventListener("click", startGame);
  startGame();
</script>
</body>
</html>
