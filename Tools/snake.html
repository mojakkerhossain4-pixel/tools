<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Toolbox</title>
<style>
  :root{
    --page: #FBF9F4;
    --ink: #201A12;
    --ink-soft: #6B6153;
    --line: #E4DDCB;
    --indigo-a: #2E2A52;
    --indigo-b: #433C74;
    --cream: #F5EFE1;
    --gold: #F2C169;
    --mint: #EAF3E8;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 24px 56px; }
  header{ padding: 30px 0 26px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .back{ font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); text-decoration: none; }
  .back:hover{ text-decoration: underline; }
  .badge{ font-size: 12.5px; color: var(--ink-soft); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
  h1{ font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1.1; margin: 4px 0 10px; }
  .lede{ color: var(--ink-soft); font-size: 15.5px; margin: 0 0 24px; }
  .game-card{ padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .game-header{ display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
  .score-label{ color: var(--ink-soft); font-size: 13px; }
  .score{ display: block; color: var(--indigo-a); font: 26px var(--font-display); line-height: 1.1; }
  .best-score{ text-align: right; }
  canvas{ display: block; width: 100%; height: auto; border-radius: 12px; background: var(--indigo-a); touch-action: none; }
  .actions{ display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button{ min-height: 44px; border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px var(--font-body); cursor: pointer; }
  button:disabled{ opacity: .5; cursor: default; }
  .primary{ background: var(--indigo-a); color: var(--cream); }
  .primary:hover:not(:disabled){ background: var(--indigo-b); }
  .secondary{ background: var(--mint); color: #245145; }
  .secondary:hover:not(:disabled){ background: #DCEBDD; }
  .status{ min-height: 24px; margin: 12px 0 0; color: var(--ink-soft); font-size: 13.5px; }
  .touch-controls{ display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 44px); justify-content: center; gap: 6px; margin-top: 14px; }
  .touch-controls button{ padding: 0; border: 1px solid var(--line); background: #fff; color: var(--indigo-a); font-size: 18px; }
  .touch-controls button:hover{ background: var(--mint); }
  .touch-controls .up{ grid-column: 2; grid-row: 1; }
  .touch-controls .left{ grid-column: 1; grid-row: 2; }
  .touch-controls .down{ grid-column: 2; grid-row: 2; }
  .touch-controls .right{ grid-column: 3; grid-row: 2; }
  .help{ margin: 18px 0 0; color: var(--ink-soft); font-size: 13px; text-align: center; }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--indigo-a); outline-offset: 3px; }
  @media (max-width: 480px){ .wrap{ padding: 0 18px 40px; } .game-card{ padding: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">Toolbox</a>
    <span class="badge">A little offline fun</span>
  </header>

  <h1>Snake</h1>
  <p class="lede">Eat the glowing fruit, grow your snake, and avoid the walls and your own tail.</p>

  <main class="game-card" aria-label="Snake game">
    <div class="game-header">
      <div><span class="score-label">SCORE</span><strong class="score" id="score">0</strong></div>
      <div class="best-score"><span class="score-label">BEST</span><strong class="score" id="bestScore">0</strong></div>
    </div>
    <canvas id="board" width="600" height="480" role="img" aria-label="Snake game board"></canvas>
    <p class="status" id="status" aria-live="polite">Press Start or an arrow key to play.</p>
    <div class="actions">
      <button class="primary" id="startButton" type="button">Start game</button>
      <button class="secondary" id="pauseButton" type="button" disabled>Pause</button>
    </div>
    <div class="touch-controls" aria-label="Touch controls">
      <button class="up" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="left" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="down" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="right" type="button" data-direction="right" aria-label="Move right">→</button>
    </div>
    <p class="help">Use arrow keys or WASD to move. Press Space to pause. On a phone, use the arrows.</p>
  </main>
</div>
<script>
  const canvas = document.getElementById("board");
  const context = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");
  const bestScoreElement = document.getElementById("bestScore");
  const statusElement = document.getElementById("status");
  const startButton = document.getElementById("startButton");
  const pauseButton = document.getElementById("pauseButton");
  const cellSize = 24;
  const columns = canvas.width / cellSize;
  const rows = canvas.height / cellSize;
  const directions = {
    up: {x: 0, y: -1},
    down: {x: 0, y: 1},
    left: {x: -1, y: 0},
    right: {x: 1, y: 0}
  };
  let snake;
  let direction;
  let nextDirection;
  let food;
  let score;
  let bestScore = 0;
  let state = "ready";
  let timer;

  function placeFood(){
    const emptyCells = [];
    for(let y = 0; y < rows; y++){
      for(let x = 0; x < columns; x++){
        if(!snake.some(segment => segment.x === x && segment.y === y)) emptyCells.push({x, y});
      }
    }
    food = emptyCells.length ? emptyCells[Math.floor(Math.random() * emptyCells.length)] : null;
  }

  function resetGame(){
    snake = [{x: 12, y: 10}, {x: 11, y: 10}, {x: 10, y: 10}];
    direction = directions.right;
    nextDirection = direction;
    score = 0;
    scoreElement.textContent = score;
    placeFood();
    draw();
  }

  function draw(){
    context.fillStyle = "#2E2A52";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = "rgba(245,239,225,0.07)";
    context.lineWidth = 1;
    for(let x = 0; x <= canvas.width; x += cellSize){
      context.beginPath();
      context.moveTo(x, 0);
      context.lineTo(x, canvas.height);
      context.stroke();
    }
    for(let y = 0; y <= canvas.height; y += cellSize){
      context.beginPath();
      context.moveTo(0, y);
      context.lineTo(canvas.width, y);
      context.stroke();
    }
    if(food){
      context.fillStyle = "#F2C169";
      context.beginPath();
      context.arc(food.x * cellSize + cellSize / 2, food.y * cellSize + cellSize / 2, cellSize * 0.34, 0, Math.PI * 2);
      context.fill();
    }
    snake.forEach((segment, index) => {
      context.fillStyle = index === 0 ? "#EAF3E8" : "#75B29A";
      context.beginPath();
      context.roundRect(segment.x * cellSize + 2, segment.y * cellSize + 2, cellSize - 4, cellSize - 4, 6);
      context.fill();
    });
    if(state !== "running"){
      const message = state === "ready" ? "READY?" : state === "paused" ? "PAUSED" : "GAME OVER";
      context.fillStyle = "rgba(32,26,18,0.58)";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#F5EFE1";
      context.textAlign = "center";
      context.font = "36px Georgia, serif";
      context.fillText(message, canvas.width / 2, canvas.height / 2);
    }
  }

  function setState(nextState, message){
    state = nextState;
    statusElement.textContent = message;
    startButton.textContent = nextState === "over" ? "Play again" : nextState === "paused" ? "Resume" : "Start game";
    pauseButton.disabled = nextState !== "running";
    pauseButton.textContent = "Pause";
    draw();
  }

  function startGame(){
    if(state === "over") resetGame();
    clearInterval(timer);
    setState("running", "Game on! Collect the fruit to grow.");
    timer = setInterval(tick, 115);
  }

  function pauseGame(){
    clearInterval(timer);
    setState("paused", "Game paused. Press Resume or Space to continue.");
  }

  function tick(){
    direction = nextDirection;
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if(head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows ||
       body.some(segment => segment.x === head.x && segment.y === head.y)){
      clearInterval(timer);
      setState("over", `Game over! You scored ${score}. Start a new game to try again.`);
      return;
    }
    snake.unshift(head);
    if(eating){
      score += 1;
      scoreElement.textContent = score;
      if(score > bestScore){
        bestScore = score;
        bestScoreElement.textContent = bestScore;
      }
      placeFood();
      if(!food){
        clearInterval(timer);
        setState("over", `You filled the board! Final score: ${score}.`);
        return;
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function changeDirection(name){
    const requested = directions[name];
    if(!requested || state === "over") return;
    if(requested.x === -direction.x && requested.y === -direction.y) return;
    nextDirection = requested;
    if(state === "ready") startGame();
    else if(state === "paused") startGame();
  }

  document.addEventListener("keydown", event => {
    const keyDirections = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };
    if(keyDirections[event.key]){
      event.preventDefault();
      changeDirection(keyDirections[event.key]);
    } else if(event.code === "Space" && state !== "ready" && state !== "over"){
      event.preventDefault();
      if(state === "running") pauseGame();
      else startGame();
    } else if(event.code === "Space" && state === "ready"){
      event.preventDefault();
      startGame();
    }
  });

  document.querySelectorAll("[data-direction]").forEach(button => {
    button.addEventListener("click", () => changeDirection(button.dataset.direction));
  });
  startButton.addEventListener("click", startGame);
  pauseButton.addEventListener("click", pauseGame);

  bestScoreElement.textContent = bestScore;
  resetGame();
  setState("ready", "Press Start or an arrow key to play.");
</script>
</body>
</html>
