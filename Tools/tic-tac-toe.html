<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — Toolbox</title>
<style>
  :root{
    --page: #FBF9F4;
    --ink: #201A12;
    --ink-soft: #6B6153;
    --line: #E4DDCB;
    --teal-a: #1F5C52;
    --teal-b: #2E8577;
    --mint: #EAF3E8;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
  .wrap{ max-width: 560px; margin: 0 auto; padding: 0 24px 56px; }
  header{ padding: 30px 0 26px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .back{ font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink); text-decoration: none; }
  .back:hover{ text-decoration: underline; }
  .badge{ font-size: 12.5px; color: var(--ink-soft); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
  h1{ font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1.1; margin: 4px 0 10px; }
  .lede{ color: var(--ink-soft); font-size: 15.5px; margin: 0 0 24px; }
  .game-card{ padding: 20px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .status{ min-height: 26px; margin: 0 0 16px; color: var(--teal-a); font-size: 15px; font-weight: 600; text-align: center; }
  .board{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell{ aspect-ratio: 1; border: 1px solid var(--line); border-radius: 14px; background: #FBF9F4; color: var(--teal-a); font: 56px var(--font-display); cursor: pointer; }
  .cell:hover:enabled{ background: var(--mint); }
  .cell:disabled{ cursor: default; }
  .cell.x{ color: var(--teal-a); }
  .cell.o{ color: #A64B5C; }
  .cell.winner{ background: var(--mint); }
  .actions{ display: flex; justify-content: center; margin-top: 18px; }
  .primary{ min-height: 44px; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--teal-a); color: #fff; font: 600 14px var(--font-body); cursor: pointer; }
  .primary:hover{ background: #17483F; }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--teal-a); outline-offset: 3px; }
  @media (max-width: 480px){ .wrap{ padding: 0 18px 40px; } .game-card{ padding: 14px; } .cell{ font-size: 46px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">Toolbox</a>
    <span class="badge">Two-player game</span>
  </header>

  <h1>Tic-Tac-Toe</h1>
  <p class="lede">Take turns with a friend on the same screen. Get three marks in a row to win.</p>

  <main class="game-card" aria-label="Tic-Tac-Toe game">
    <p class="status" id="status" aria-live="polite">X goes first.</p>
    <div class="board" role="group" aria-label="Game board">
      <button class="cell" type="button" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" aria-label="Row 3, column 3"></button>
    </div>
    <div class="actions"><button class="primary" id="newGame" type="button">New game</button></div>
  </main>
</div>
<script>
  const cells = Array.from(document.querySelectorAll(".cell"));
  const statusElement = document.getElementById("status");
  const winningLines = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];
  let board = Array(9).fill("");
  let currentPlayer = "X";
  let gameOver = false;

  function winner(){
    return winningLines.find(line => line.every(index => board[index] === currentPlayer));
  }

  function play(index){
    if(gameOver || board[index]) return;
    board[index] = currentPlayer;
    const cell = cells[index];
    cell.textContent = currentPlayer;
    cell.classList.add(currentPlayer.toLowerCase());
    cell.setAttribute("aria-label", `${cell.getAttribute("aria-label")}, ${currentPlayer}`);
    const line = winner();
    if(line){
      gameOver = true;
      statusElement.textContent = `${currentPlayer} wins!`;
      line.forEach(winningIndex => cells[winningIndex].classList.add("winner"));
    } else if(board.every(Boolean)){
      gameOver = true;
      statusElement.textContent = "It's a draw!";
    } else {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusElement.textContent = `${currentPlayer}'s turn.`;
    }
    cells.forEach((button, cellIndex) => {
      button.disabled = gameOver || Boolean(board[cellIndex]);
    });
  }

  function newGame(){
    board = Array(9).fill("");
    currentPlayer = "X";
    gameOver = false;
    statusElement.textContent = "X goes first.";
    cells.forEach((cell, index) => {
      cell.disabled = false;
      cell.textContent = "";
      cell.classList.remove("x", "o", "winner");
      cell.setAttribute("aria-label", `Row ${Math.floor(index / 3) + 1}, column ${(index % 3) + 1}`);
    });
  }

  cells.forEach((cell, index) => cell.addEventListener("click", () => play(index)));
  document.getElementById("newGame").addEventListener("click", newGame);
</script>
</body>
</html>
